name: Prototype CI

on:
  push:
    branches:
      - prototype/lovable-editor
      - prototype/replit-runtime
      - integration/no-code-vertical-slice
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        # npm 10.9.x may crash resolving optional peer sets (npm/cli#9787).
        # This avoids that installer crash without changing runtime dependencies.
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Playtests
        run: npm run playtest -- --all --quiet --no-timeline
      - name: Production build
        run: npm run build
